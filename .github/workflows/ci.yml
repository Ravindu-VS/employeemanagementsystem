name: CI

on:
  pull_request:
  push:
    branches: [main, 'fix/**', 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholder Firebase config: the build only needs the variables to exist.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:0:web:0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: admin-dashboard
      - name: Type check
        run: npm run typecheck
        working-directory: admin-dashboard
      - name: Lint
        run: npm run lint
        working-directory: admin-dashboard
      - name: Unit tests (payroll engine, attendance persistence, dates, UI)
        run: npm test
        working-directory: admin-dashboard
      - name: Unit tests in other timezones
        run: |
          TZ=UTC npm test
          TZ=Pacific/Kiritimati npm test
          TZ=Etc/GMT+12 npm test
        working-directory: admin-dashboard
      - name: Firestore security rules tests (emulator)
        run: npm run test:rules
        working-directory: admin-dashboard
      - name: Build
        run: npm run build
        working-directory: admin-dashboard

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai-service, notification-service]
    defaults:
      run:
        working-directory: admin-dashboard/backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: admin-dashboard/backend/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (${{ matrix.service }})
        run: python -m pytest -q
